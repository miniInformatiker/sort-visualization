[package]
name = "sort-visualization"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts", "glow"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.28"
ratatui = "0.29"
